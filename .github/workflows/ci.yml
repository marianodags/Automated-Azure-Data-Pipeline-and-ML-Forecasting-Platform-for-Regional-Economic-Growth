name: Regional Economic Intelligence Platform CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest Test Suite & Pipelines
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Seed Database
      run: |
        PYTHONPATH=. python database/seed.py

    - name: Run ML Forecasting Engine
      run: |
        PYTHONPATH=. python ml/forecaster.py

    - name: Run AI Narrative Insights Generator
      run: |
        PYTHONPATH=. python ml/insights.py

    - name: Run Pytest Suite
      run: |
        PYTHONPATH=. pytest -v
